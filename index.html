    <script>
      (function() {
        window.addEventListener('error', function(e) {
          if (e && e.message && (e.message.indexOf('originalPrompt') !== -1 || e.message.indexOf('has already been declared') !== -1)) {
            e.preventDefault();
            e.stopImmediatePropagation();
            return true;
          }
        }, true);

        var prevOnError = window.onerror;
        window.onerror = function(msg) {
          if (typeof msg === 'string' && (msg.indexOf('originalPrompt') !== -1 || msg.indexOf('has already been declared') !== -1)) {
            return true;
          }
          if (prevOnError) return prevOnError.apply(this, arguments);
        };

        var nativeEval = window.eval;
        if (nativeEval) {
          window.eval = function(code) {
            if (typeof code === 'string' && code.indexOf('originalPrompt') !== -1) {
              code = code.replace(/\b(const|let)\s+originalPrompt\b/g, 'var originalPrompt');
            }
            return nativeEval.call(this, code);
          };
        }

        try {
          var origAppendChild = Node.prototype.appendChild;
          Node.prototype.appendChild = function(child) {
            if (child && child.nodeName === 'SCRIPT' && child.textContent && child.textContent.indexOf('originalPrompt') !== -1) {
              child.textContent = child.textContent.replace(/\b(const|let)\s+originalPrompt\b/g, 'var originalPrompt');
            }
            return origAppendChild.call(this, child);
          };

          var origInsertBefore = Node.prototype.insertBefore;
          Node.prototype.insertBefore = function(newNode, refNode) {
            if (newNode && newNode.nodeName === 'SCRIPT' && newNode.textContent && newNode.textContent.indexOf('originalPrompt') !== -1) {
              newNode.textContent = newNode.textContent.replace(/\b(const|let)\s+originalPrompt\b/g, 'var originalPrompt');
            }
            return origInsertBefore.call(this, newNode, refNode);
          };
        } catch (_) {}
      })();
    </script>
